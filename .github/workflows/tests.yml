name: Release tests

on:
  push:
    tags:
      - "v*.*"
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eta-digital-dosage
    steps:
      - uses: actions/checkout@v4

      - name: Validate version tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected vMAJOR.MINOR or vMAJOR.MINOR.PATCH, for example v1.2 or v1.2.0."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: eta-digital-dosage/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting
        run: black --check src tests scripts

      - name: Run lint
        run: ruff check src tests scripts

      - name: Run tests
        run: pytest

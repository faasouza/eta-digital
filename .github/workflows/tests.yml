name: Version-tag validation

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate semantic version tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: eta-digital-dosage/pyproject.toml
      - name: Install
        run: make install
      - name: Formatting
        run: make black-check
      - name: Lint
        run: make lint
      - name: Tests and end-to-end validation
        run: make e2e

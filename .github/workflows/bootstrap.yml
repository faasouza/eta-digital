name: Bootstrap repository
on:
  push:
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand validated repository payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/payload.part05 || { echo 'Waiting for all payload parts'; exit 0; }
          cat .bootstrap/payload.part* | base64 -d > /tmp/eta-digital.tar.gz
          tar -xzf /tmp/eta-digital.tar.gz
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - name: Commit generated repository
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: implement ETA-DIGITAL dosage platform'
          git push

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eta-digital-dosage"
version = "0.1.0"
description = "Contextual mixture-of-experts and robust dosage recommendation for ETA-DIGITAL"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "mlflow>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "jupyter>=1,<2", "openpyxl>=3.1,<4", "xlrd>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
